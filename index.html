<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的音乐主页</title>
    <style>
        body {
            font-family: sans-serif;
            text-align: center;
            padding-top: 50px;
            background-color: #f0f2f5;
        }
        .player-container {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            display: inline-block;
        }
    </style>
</head>
<body>

    <div class="player-container">
        <h1>🎵 正在播放</h1>
        
        <!-- 这里是关键代码 -->
        <audio controls autoplay loop>
            <!-- src 后面填的是你的MP3文件名，必须完全一致！ -->
            <source src="Home Free - Your Man_L.mp3" type="audio/mpeg">
            您的浏览器不支持 audio 元素。
        </audio>
        
        <p>如果无法自动播放，请点击下方的播放按钮。</p>
    </div>

</body>
</html>
